<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casting de Bailarinas — Banda Latina Independiente Uspantán</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="hero">
    <img src="images/logo.png" alt="Banda Latina Independiente Uspantán" class="hero-logo">
    <div class="hero-content">
      <h1>Casting de<br>Bailarinas</h1>
      <p class="hero-sub">Banda Latina Independiente Uspantán</p>
    </div>
  </section>

  <section class="form-section" id="registro">
    <div class="form-wrap">
      <p class="section-label">✦ Postulación</p>
      <h2 class="section-title">Regístrate al Casting</h2>

      <div id="form-container">
        <div class="form-group">
          <label for="f-name">Nombre y Apellido *</label>
          <input type="text" id="f-name" placeholder="Tu nombre completo">
        </div>

        <div class="form-group">
          <label for="f-age">Edad *</label>
          <input type="number" id="f-age" min="1" placeholder="Tu edad">
        </div>

        <div class="form-group">
          <label for="f-phone">Número de Teléfono *</label>
          <input type="tel" id="f-phone" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="Numero de telefono" required>
        </div>

        <div class="form-group">
          <label for="f-availability">Disponibilidad de Tiempo para Ensayos *</label>
          <textarea id="f-availability" rows="3" placeholder="Cuéntanos qué días y horarios tienes disponibles para comprometerte con los ensayos"></textarea>
        </div>

        <button class="btn-primary" id="submit-btn" onclick="submitForm()">
          POSTULARME →
        </button>
        <p class="form-note">✦ ¡Gracias por postularte!</p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
